[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-dogmode-guardian"
version = "0.1.0"
description = "Tesla Dog Mode Guardian — backup safety alerts to a second person if cabin temperature drifts while Dog Mode is on. Because one phone notification isn't enough."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raphael Malikian", email = "rtmalikian@gmail.com" }]
keywords = ["tesla", "fleet-api", "dog-mode", "pet-safety", "cabin-temperature", "battery", "home-automation"]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.scripts]
tcc-dog = "tesla_dogmode_guardian.cli:main"

[project.urls]
Homepage = "https://github.com/rtmalikian/tesla-dogmode-guardian"
Issues = "https://github.com/rtmalikian/tesla-dogmode-guardian/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
